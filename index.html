<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Основные мета-теги -->
    <title>Каталог товаров - React Router + Material-UI</title>
    <meta name="description" content="Современный каталог товаров с использованием React Router v6 и Material-UI. Адаптивный дизайн, красивые карточки товаров, детальная информация о продуктах." />
    <meta name="keywords" content="React, Material-UI, каталог, товары, адаптивный дизайн, e-commerce, электроника, компьютеры, гаджеты" />
    <meta name="author" content="React Router + Material-UI Catalog" />
    
    <!-- Open Graph мета-теги -->
    <meta property="og:title" content="Каталог товаров - React Router + Material-UI" />
    <meta property="og:description" content="Современный каталог товаров с адаптивным дизайном. 8 категорий товаров: электроника, компьютеры, аудио, гаджеты и многое другое." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://react-router-mui-catalog.netlify.app" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=1200&h=630&fit=crop" />
    <meta property="og:site_name" content="Каталог товаров" />
    <meta property="og:locale" content="uk_UA" />
    
    <!-- Twitter Card мета-теги -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Каталог товаров - React Router + Material-UI" />
    <meta name="twitter:description" content="Современный каталог товаров с адаптивным дизайном и красивыми карточками товаров" />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=1200&h=630&fit=crop" />
    
    <!-- Дополнительные SEO мета-теги -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="msapplication-TileColor" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Каталог товаров" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://react-router-mui-catalog.netlify.app" />
    
    <!-- Предзагрузка шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Структурированные данные JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Каталог товаров",
      "description": "Современный каталог товаров с использованием React Router v6 и Material-UI",
      "url": "https://react-router-mui-catalog.netlify.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://react-router-mui-catalog.netlify.app/products?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
